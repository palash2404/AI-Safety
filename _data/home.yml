programs:
  title: Go deeper into AI safety.
  intro: Start with the fundamentals in our weekly Introductory Fellowship, join one of our weekly Reading Groups on AI Safety and AI Security, or spend a weekend going hands-on at our AI Safety Bootcamp.
  items:
    - name: Introductory Fellowship
      program: introductory
      tag: Weekly
      summary: Learn the fundamentals of AI Safety and Governance through a weekly reading and discussion group.
      points:
        - lead: "Explore the key challenges:"
          text: technical safety, governance, power dynamics, and societal impact
        - lead: Discuss current approaches
          text: to ensuring AI systems remain controllable and beneficial
        - lead: Build understanding
          text: in a supportive, interdisciplinary community
      link: "/introductory-fellowship/"
    - name: Reading Groups
      program: reading
      tag: Weekly
      summary: Two weekly reading groups on AI Safety and AI Security, starting on 16 November. Join one or both, with one interest form, or just drop by.
      points:
        - lead: "AI Security:"
          text: Mondays, 17:00–19:00 in E1.7, Room 0.08, led by Esha Afzal
        - lead: "AI Safety:"
          text: Tuesdays, 17:00–19:00 in E1.7, Room 0.08, led by Mahalakshmi Raveenthiran
        - lead: "Read, then discuss:"
          text: about an hour of reading together and an hour of discussion
      link: "/reading-groups/"
    - name: AI Safety Bootcamp
      program: bootcamp
      tag: January 2027
      summary: A weekend-long, mostly technical bootcamp covering AI safety and AI security at Saarland University.
      points:
        - lead: "One shared track:"
          text: core sessions for everyone, with optional deep dives and live coding
        - lead: "Safety and security:"
          text: alignment, evals and red teaming, AI control, adversarial attacks, governance
        - lead: "Leave with a project:"
          text: a proposal of your own and a mentor to support it
      link: "/bootcamp/"
    - name: Advanced Fellowship
      program: advanced
      tag: Hands-on
      summary: Go deeper into the technical methods shaping the future of AI safety through focused reading, discussion, and practice.
      points:
        - lead: "Evaluation:"
          text: how we test what capabilities AI models have and how they act in certain situations
        - lead: "Interpretability:"
          text: what we can learn about AI models by looking at their internal workings
        - lead: "Engage with active research:"
          text: discuss key papers, run experiments, and hear from researchers
      link: "/advanced-fellowship/"

security:
  title: AI Security Team
  text: Making AI safe also requires security — to stop adversaries gaining access to powerful models, individuals training secret loyalties into models, or models exfiltrating themselves. Join us if you're especially interested in the intersection of cybersecurity and AI.
  link: "/ai-security/"
  activities:
    - name: AI Security Reading Group
      tag: Weekly
      text: A weekly reading group on Mondays, 17:00–19:00 in E1.7, Room 0.08, starting on 16 November, on problems like jailbreaks, data poisoning, model stealing and the security of LLM agents. It shares one interest form with the AI Safety Reading Group, on the Reading Groups page.
    - name: AI Security Afternoon
      tag: Once a semester
      text: A half-day event with invited talks from people working on AI security professionally, plus time for students to connect and ask questions.
    - name: AI Security Research Sprints
      tag: Coming soon
      text: Structured sprints for students who want to move from reading about AI security to working on it. More details to be announced.

events:
  title: Talks, socials and exchange.
  text: We host regular public events with invited speakers as well as casual get-togethers to build a community. Fellows get access to further exclusive events.

join:
  title: Don't want to miss what's next?
  text: Join the community to hear about fellowships, reading groups and events first.
