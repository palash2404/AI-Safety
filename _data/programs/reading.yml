faqs:
  - question: Is it one form for both reading groups?
    answer: |
      Yes. Fill in the [interest form](https://forms.gle/nu4BgpWbVrpo6T4M6) once and pick AI Safety, AI Security, or both.
  - question: Can I join both reading groups?
    answer: |
      Yes. Come to one or both, whatever fits your interests. Pick "Both" in the [interest form](https://forms.gle/nu4BgpWbVrpo6T4M6) so we know to plan for you in each group.
  - question: Who runs the reading groups?
    answer: |
      The AI Safety Reading Group on Tuesdays is led by Mahalakshmi Raveenthiran. The AI Security Reading Group on Mondays is led by Esha Afzal.
  - question: Do I have to sign up to come?
    answer: |
      No, you can just drop by. The form helps us plan topics and formats, so we'd still appreciate it if you fill it in.
  - question: Do I need to prepare before each session?
    answer: |
      Usually not. We read together in the first hour. If a reading builds on earlier work or is too long for an hour, the organisers say which parts to read beforehand.
  - question: Do I need a technical background?
    answer: |
      No. Some readings are technical papers and others are blog posts or reports. The form asks how comfortable you are with technical papers so we can pitch the readings well.
