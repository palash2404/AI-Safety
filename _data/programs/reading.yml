about_title: One form, two reading groups
about: |
  The **same interest form** is for both reading groups. You can join **one group or both**: in the form you choose AI Safety, AI Security, or both, and tell us which topics you'd like to read about.

  You don't have to register to take part. Feel free to just drop by. The form takes about five minutes and helps us plan topics and formats around what people are interested in.

  Each session is two hours: about an hour of reading together, then an hour of discussion. Sometimes there are snacks.

details:
  - title: AI Safety Reading Group
    text: |
      - **Led by:** Mahalakshmi Raveenthiran
      - **When:** Tuesdays, 17:00–19:00
      - **Where:** E1.7, Room 0.08
      - **Starts:** second week of November
      - **Topics may include:** risks from advanced AI and threat models, alignment (RLHF, scalable oversight), interpretability, evals and red teaming, AI control, deception and scheming, governance and policy, and societal impacts
  - title: AI Security Reading Group
    text: |
      - **Led by:** Esha Afzal
      - **When:** Mondays, 17:00–19:00
      - **Where:** E1.7, Room 0.08
      - **Starts:** second week of November
      - **Topics may include:** jailbreaks and prompt injection, adversarial robustness, data poisoning and backdoors, model stealing, privacy attacks, security of LLM agents, AI for cyber offence and defence, and watermarking and deepfake detection
  - title: Choosing what we read
    text: |
      Members propose papers, blog posts, reports or videos, and vote on what to read. A proposal includes:

      - **Title and link**
      - **Type:** paper, blog post, article, report, video, …
      - **Why read it:** one or two lines
      - **Reading time:** a rough estimate
      - **Prerequisites:** what someone needs to know to follow it, and which parts to read beforehand if it can't be read in about an hour

      The reading with the most votes wins, and the organisers break ties. Proposals that aren't picked go to a backlog and can be voted on again later.

