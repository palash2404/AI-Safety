about_title: What you'll explore
about: |
  Mitigating [risks from advanced AI](https://aistatement.org) is possibly the most pressing problem of our time.

  The 10-week **Advanced Fellowship** explores the most promising technical approaches to understanding highly capable models, which we consider broadly useful for addressing many different problems, such as misalignment or misuse.

  We focus on two important topics:

  - **Evaluation:** How can we test what capabilities AI models have and how they will act in certain situations?
  - **Interpretability:** Can we learn more about AI models by looking at their internal workings?

  In the first session, we'll have a broad recap and a discussion about possible sources of risk. Then we'll have four sessions on each of the two technical topics:

  1. General introduction
  2. Paper discussion
  3. Hands-on experiments
  4. Q&A with a researcher

  Among other things, we'll discuss how we know that [refusal is mediated by a single direction](https://arxiv.org/abs/2406.11717), and what can be said about [the length of tasks AI can do](https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/) over time.

  Finally, we'll have a session on career progression with these problems in mind.

  **If this sounds interesting to you, don't hesitate to apply!**

