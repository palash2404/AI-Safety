<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Security policy (GitHub Pages can't send headers, so it lives here). Only our own
     scripts may run, which blocks script injected through content or a javascript: link. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; media-src 'self' https:; frame-src 'self' https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{% if page.title %}{{ page.title | escape }} · {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | strip_newlines | escape }}">
<meta name="theme-color" content="#fdfdfb">
<meta name="color-scheme" content="light">
{% if page.program and site.data.programs[page.program].live == false %}<meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url={{ '/programs/' | relative_url }}">{% endif %}
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/epilogue-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

{% include now-panel.html %}
{% include header.html %}

{{ content }}

{% include footer.html %}

<script src="{{ '/assets/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
