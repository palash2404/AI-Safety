<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | strip_newlines | escape }}">
<meta name="theme-color" content="#0d2a1e">
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/bricolage-grotesque-latin-opsz-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/figtree-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>

{% include header.html %}

{{ content }}

{% include footer.html %}

<script src="{{ '/assets/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
