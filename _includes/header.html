<header class="bar" data-bar>
  <div class="container bar__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="AI Safety Saarland, home">
      <img src="{{ '/assets/logo.png' | relative_url }}" alt="" width="55" height="48">
      <span>AI Safety Saarland</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{{ '/programs/' | relative_url }}"{% if page.nav == 'programs' %} aria-current="page"{% endif %}>Programs</a>
      {% if site.ai_security_live %}<a href="{{ '/ai-security/' | relative_url }}"{% if page.nav == 'security' %} aria-current="page"{% endif %}>AI Security</a>{% endif %}
      <a href="{{ '/' | relative_url }}#events">Events</a>
      <a href="{{ '/updates.html' | relative_url }}"{% if page.nav == 'updates' %} aria-current="page"{% endif %}>Updates</a>
    </nav>
    <a class="btn btn--quiet bar__join" href="{{ site.whatsapp }}" target="_blank" rel="noopener noreferrer">Join our community</a>
  </div>
</header>
