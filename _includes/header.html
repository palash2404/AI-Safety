<header class="site-header">
  <div class="wrap header-inner">
    <a href="{{ '/' | relative_url }}" class="brand">
      <img src="{{ '/assets/logo.png' | relative_url }}" alt="" class="brand-mark" width="55" height="48">
      <span class="brand-name">AI Safety <span>Saarland</span></span>
    </a>

    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="{{ '/team.html' | relative_url }}"{% if page.nav == 'team' %} aria-current="page"{% endif %}>Team</a>
      <a href="{{ '/programs/' | relative_url }}"{% if page.nav == 'programs' %} aria-current="page"{% endif %}>Programs</a>
      <a href="{{ '/' | relative_url }}#security">AI Security</a>
      <a href="{{ '/' | relative_url }}#events">Events</a>
      <a href="{{ '/updates.html' | relative_url }}"{% if page.nav == 'updates' %} aria-current="page"{% endif %}>Updates</a>
      <a href="{{ site.whatsapp }}" target="_blank" rel="noopener noreferrer" class="btn btn-primary nav-join">Join us</a>
      <div class="nav-social">
        <a href="{{ site.instagram }}" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6"/></svg></a>
        <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="8" y1="10.5" x2="8" y2="17"/><circle cx="8" cy="7.3" r="0.6"/><path d="M12 17v-6.5M12 13.5c0-2 1.3-3 2.8-3s2.2 1 2.2 3V17"/></svg></a>
      </div>
    </nav>

    <div class="header-actions">
      <a href="{{ site.instagram }}" target="_blank" rel="noopener noreferrer" class="icon-link" aria-label="Instagram"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6"/></svg></a>
      <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer" class="icon-link" aria-label="LinkedIn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="8" y1="10.5" x2="8" y2="17"/><circle cx="8" cy="7.3" r="0.6"/><path d="M12 17v-6.5M12 13.5c0-2 1.3-3 2.8-3s2.2 1 2.2 3V17"/></svg></a>
      <a href="{{ site.whatsapp }}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Join us</a>
    </div>
  </div>
</header>
